name: Lint ktfmt
on:
  workflow_dispatch:
  push:
    paths:
      - 'support/android/apk/**'
  pull_request:
    paths:
      - 'support/android/apk/**'

jobs:
  ktfmt-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: support/android/apk
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run ktfmtCheck with diagnostics
        run: |
          ./gradlew :servoview:ktfmtCheckScripts --info --rerun-tasks || true
          printf '\n--- servoview/build.gradle.kts current content ---\n'
          sed -n '1,25p' servoview/build.gradle.kts
