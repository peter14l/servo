# Vendored from the `wr_glyph_rasterizer` 0.70.1 release and patched to add
# DirectWrite color glyph (COLR/CPAL) rasterization on Windows. See
# `README.md` and `[patch.crates-io]` in the repository root `Cargo.toml`.

[package]
edition = "2018"
name = "wr_glyph_rasterizer"
version = "0.70.1"
authors = ["The Mozilla Project Developers"]
description = "A glyph rasterizer for WebRender"
readme = "README.md"
license = "MPL-2.0"
resolver = "2"

[features]
capture = [
    "api/serialize",
    "serde",
    "smallvec/serde",
]
default = ["static_freetype"]
dynamic_freetype = []
replay = [
    "api/deserialize",
    "serde",
    "smallvec/serde",
]
static_freetype = ["freetype/freetype-sys"]

[lib]
name = "wr_glyph_rasterizer"
path = "src/lib.rs"

[dependencies.api]
version = "0.70"
package = "webrender_api"

[dependencies.euclid]
version = "0.22.0"
features = ["serde"]

[dependencies.lazy_static]
version = "1"

[dependencies.log]
version = "0.4"

[dependencies.malloc_size_of]
version = "0.2.2"
package = "wr_malloc_size_of"

[dependencies.malloc_size_of_derive]
version = "0.1"

[dependencies.rayon]
version = "1"

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.serde]
version = "1.0"
features = ["serde_derive"]
optional = true

[dependencies.smallvec]
version = "1"

[dependencies.tracy-rs]
version = "0.1.2"

[target.'cfg(any(target_os = "android", all(unix, not(any(target_os = "macos", target_os = "ios")))))'.dependencies.freetype]
version = "0.8"
default-features = false

[target.'cfg(any(target_os = "android", all(unix, not(any(target_os = "macos", target_os = "ios")))))'.dependencies.libc]
version = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.core-foundation]
version = "0.9.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.core-graphics]
version = "0.23"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.core-text]
version = "20.1"
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc]
version = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.dwrote]
version = "0.11.5"

# Only used by the local color emoji patch; `dwrote` does not expose
# `IDWriteFactory2::TranslateColorGlyphRun`.
[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3.9"
features = [
    "basetsd",
    "d3d9types",
    "dcommon",
    "dwrite",
    "dwrite_2",
    "guiddef",
    "minwindef",
    "unknwnbase",
    "windef",
    "winerror",
    "winnt",
]
