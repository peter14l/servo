name: Lint ktfmt
on:
  workflow_dispatch:
  push:
    paths:
      - 'support/android/apk/**'
  pull_request:
    paths:
      - 'support/android/apk/**'

jobs:
  ktfmt-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: support/android/apk
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Print ktfmt plugin-equivalent formatted output
        run: |
          cat > /tmp/.editorconfig <<'EOF'
          root = true

          [*.kts]
          ktfmt_trailing_comma_management_strategy = complete
          EOF
          curl -fsSL -o /tmp/ktfmt.jar https://github.com/Kotlin/ktfmt/releases/download/v0.64/ktfmt-0.64-with-dependencies.jar
          cp servoview/build.gradle.kts /tmp/build.gradle.kts
          java -jar /tmp/ktfmt.jar --kotlinlang-style --enable-editorconfig /tmp/build.gradle.kts
          printf '\n--- ktfmt 0.64 kotlinLangStyle + COMPLETE output ---\n'
          cat /tmp/build.gradle.kts
