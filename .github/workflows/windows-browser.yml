name: Native Windows Browser Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-browser.yml'
      - 'ports/windows/**'
      - 'ffi/capi/**'
      - 'support/cmake/**'
      - 'support/packaging/windows/**'
      - 'components/**'
  pull_request:
    paths:
      - '.github/workflows/windows-browser.yml'
      - 'ports/windows/**'
      - 'ffi/capi/**'
      - 'support/cmake/**'
      - 'support/packaging/windows/**'
      - 'components/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # Source-only gates. Intentionally no build, no mach/cargo/msbuild and no tests:
  # the heavy Windows job below remains the single build path for this workflow.
  source-gates:
    name: Lightweight source gates (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve diff range
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ steps.diff.outputs.range }}"

      - name: Source-only gates (XML, forbidden patterns, secrets)
        shell: bash
        env:
          DIFF_RANGE: ${{ steps.diff.outputs.range }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          root = subprocess.check_output(
              ["git", "rev-parse", "--show-toplevel"], text=True
          ).strip()
          changed = [
              path
              for path in subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMR", os.environ["DIFF_RANGE"]],
                  text=True,
              ).splitlines()
              if path
          ]

          # 1. XAML / MSBuild files must stay well-formed XML.
          xml_suffixes = (
              ".xaml", ".vcxproj", ".vcxproj.filters", ".appxmanifest",
              ".resx", ".props", ".targets",
          )
          parsed = 0
          for rel in changed:
              if not rel.lower().endswith(xml_suffixes):
                  continue
              path = os.path.join(root, rel)
              if not os.path.isfile(path):
                  continue
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  print(f"XML_PARSE_FAIL {rel}: {exc}", file=sys.stderr)
                  sys.exit(1)
              parsed += 1
          print(f"XML/XAML parse: OK ({parsed} changed file(s))")

          # 2. Forbidden source patterns. These are intentional guardrails, not lints:
          #    - IBuffer.Data() hands out a raw pointer with an easy-to-mishandle lifetime.
          #    - UserChoice must only ever be changed by the user via Windows Settings.
          data_call = re.compile(r"\.Data\s*\(")
          registry_write = re.compile(
              r"(?i)set-itemproperty|new-itemproperty|reg\s+add|regsetvalue|setvalue"
          )
          failures = []
          generated = ("graphify-out/", ".project/", "target/", "dist/")
          for rel in changed:
              low = rel.lower()
              if low.startswith(generated):
                  continue
              if not low.endswith((".cpp", ".h", ".hpp", ".cc", ".cxx", ".ps1", ".cs", ".rs")):
                  continue
              path = os.path.join(root, rel)
              if not os.path.isfile(path):
                  continue
              with open(path, "r", encoding="utf-8", errors="replace") as handle:
                  text = handle.read()
              uses_ibuffer = "IBuffer" in text
              for lineno, line in enumerate(text.splitlines(), 1):
                  if uses_ibuffer and data_call.search(line):
                      failures.append(f"FORBIDDEN IBuffer.Data() at {rel}:{lineno}")
                  if "userchoice" in line.lower() and registry_write.search(line):
                      failures.append(f"FORBIDDEN UserChoice write at {rel}:{lineno}")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("Forbidden-pattern scan: OK")

          # 3. Secret pattern scan over changed text files. Example/placeholder lines
          #    are skipped; binaries and prose docs are not scanned.
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              re.compile(
                  r"(?i)\b(?:api[_-]?key|client[_-]?secret|access[_-]?token|password)\b"
                  r"\s*[:=]\s*[\"'][^\"']{16,}[\"']"
              ),
          ]
          skip_suffixes = (
              ".md", ".png", ".jpg", ".jpeg", ".gif", ".ico", ".pdf",
              ".zip", ".dll", ".exe", ".pdb", ".lib",
          )
          secret_hits = []
          scanned = 0
          for rel in changed:
              if rel.lower().startswith(generated) or rel.lower().endswith(skip_suffixes):
                  continue
              path = os.path.join(root, rel)
              if not os.path.isfile(path):
                  continue
              with open(path, "r", encoding="utf-8", errors="replace") as handle:
                  lines = handle.read().splitlines()
              scanned += 1
              for lineno, line in enumerate(lines, 1):
                  lower = line.lower()
                  if any(word in lower for word in ("example", "placeholder", "redact", "dummy")):
                      continue
                  for pattern in secret_patterns:
                      if pattern.search(line):
                          secret_hits.append(f"SECRET_PATTERN {rel}:{lineno}")
                          break
          if secret_hits:
              print("\n".join(secret_hits), file=sys.stderr)
              print("Remove or rotate the value before merging.", file=sys.stderr)
              sys.exit(1)
          print(f"Secret-pattern scan: OK ({scanned} changed text file(s) inspected)")
          PY

  build-windows-browser:
    name: Build Native Windows Browser (x86_64)
    runs-on: windows-2022
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf

      - name: Setup Rust toolchain
        run: rustup show

      - uses: microsoft/setup-msbuild@v2

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH env (Windows)
        shell: pwsh
        run: |
          $llvm_bin = Join-Path $env:LLVM_PATH "bin"
          echo "LIBCLANG_PATH=$llvm_bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-

      - name: Cache cargo-c build
        uses: actions/cache@v5
        with:
          path: target/cinstall
          key: windows-cargo-cinstall-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-cargo-cinstall-

      - name: Install cargo-c
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c@0.10.23

      - name: Passive bootstrap (Windows)
        run: .\mach fetch

      - name: Configure Windows C compiler
        shell: pwsh
        run: |
          "CC=clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOZTOOLS_PATH=${{ github.workspace }}\target\dependencies\moztools\4.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build servo-capi (release)
        shell: bash
        env:
          RUSTC_WRAPPER: ""
          SCCACHE_GHA_ENABLED: "false"
          MSYS_NO_PATHCONV: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "true"
        run: |
          set -euo pipefail
          PREFIX="$(pwd)/target/artifacts"
          mkdir -p "$PREFIX"

          cargo cinstall -p servo-capi \
            --release \
            --library-type cdylib \
            --target-dir target/cinstall \
            --prefix "$PREFIX" \
            --libdir lib \
            --meson-paths

          # Ensure bin and lib directories exist
          mkdir -p target/artifacts/bin target/artifacts/lib
          if [ -f "target/artifacts/lib/servo_capi.dll" ]; then
            mv target/artifacts/lib/servo_capi.dll target/artifacts/bin/
          fi

          # Ensure import library exists in target/artifacts/lib
          find target/ -name "servo_capi.lib" -exec cp {} target/artifacts/lib/ \; || true
          # Ship debug symbols (PDB) alongside the DLL for crash symbolication
          find target/ -name "servo_capi.pdb" -exec cp {} target/artifacts/bin/ \; || true
          find target/ -name "servo_capi.pdb" -exec cp {} target/artifacts/lib/ \; || true
          find target/ -name "servo_capi.dll.a" -exec cp {} target/artifacts/lib/ \; || true
          find target/ -name "servo_capi.dll" -exec cp {} target/artifacts/bin/ \; || true

          # Install CMake configuration files
          mkdir -p target/artifacts/lib/cmake/Servo
          cp support/cmake/ServoConfig.cmake target/artifacts/lib/cmake/Servo/
          cp support/cmake/ServoConfigVersion.cmake target/artifacts/lib/cmake/Servo/

          # Copy C++ RAII header and ensure servo_capi.h is inside include/servo/
          mkdir -p target/artifacts/include/servo
          find target/ -name "servo_capi.h" -exec cp {} target/artifacts/include/servo/ \; || true
          find target/ -name "servo_capi.h" -exec cp {} target/artifacts/include/ \; || true
          cp ffi/capi/servo_capi.hpp target/artifacts/include/servo/

          # Ensure #pragma once is present in installed servo_capi.h headers
          if [ -f "target/artifacts/include/servo/servo_capi.h" ] && ! grep -q "#pragma once" target/artifacts/include/servo/servo_capi.h; then
            sed -i '1s/^/#pragma once\n/' target/artifacts/include/servo/servo_capi.h
          fi
          if [ -f "target/artifacts/include/servo_capi.h" ] && ! grep -q "#pragma once" target/artifacts/include/servo_capi.h; then
            sed -i '1s/^/#pragma once\n/' target/artifacts/include/servo_capi.h
          fi

          # Copy ANGLE EGL/GLES libraries from moztools/dependencies if available
          find target/ -name "libEGL.dll" -exec cp {} target/artifacts/bin/ \; || true
          find target/ -name "libGLESv2.dll" -exec cp {} target/artifacts/bin/ \; || true

      - name: Build Native Windows Browser (CMake + MSVC)
        shell: pwsh
        run: |
          $Sysroot = Join-Path (Get-Location) "target\artifacts"
          Write-Host "Artifacts tree:"
          Get-ChildItem -Recurse $Sysroot | Select-Object FullName
          New-Item -ItemType Directory -Force -Path "build-browser"
          cmake -S ports/windows -B build-browser `
            -DCMAKE_PREFIX_PATH="$Sysroot" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-browser --config Release --verbose

      - name: Run Windows Browser Unit Tests
        shell: pwsh
        run: |
          ctest --test-dir build-browser -C Release --output-on-failure

      - name: Build Native WinUI 3 Browser
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Project = "ports\windows\winui\ServoUI\ServoUI.vcxproj"
          $Sysroot = Join-Path (Get-Location) "target\artifacts"
          msbuild $Project /t:Restore /p:Configuration=Release /p:Platform=x64 /p:ServoRoot="$Sysroot"
          msbuild $Project /p:Configuration=Release /p:Platform=x64 /p:ServoRoot="$Sysroot" /m

      - name: Assemble Distribution Package
        shell: pwsh
        run: |
          $Dist = "dist/servo-windows-browser"
          New-Item -ItemType Directory -Force -Path $Dist
          
          # Copy the WinUI 3 application and its XAML/resources.
          $WinUIOut = "ports\windows\winui\ServoUI\x64\Release\ServoUI"
          if (-not (Test-Path (Join-Path $WinUIOut "ServoUI.exe"))) {
            throw "WinUI build did not produce ServoUI.exe"
          }
          Get-ChildItem -Path $WinUIOut -File |
            Where-Object { $_.Extension -in @(".exe", ".dll", ".ico", ".pri", ".pdb", ".winmd") } |
            Copy-Item -Destination $Dist/

          # Copy servo_capi.dll and import lib
          Copy-Item "target/artifacts/bin/servo_capi.dll" -Destination $Dist/
          # Copy debug symbols if present
          if (Test-Path "target/artifacts/bin/servo_capi.pdb") { Copy-Item "target/artifacts/bin/servo_capi.pdb" -Destination $Dist/ }
          
          # Copy ANGLE DLLs
          Get-ChildItem -Path "target" -Filter "libEGL.dll" -Recurse | Select-Object -First 1 | Copy-Item -Destination $Dist/
          Get-ChildItem -Path "target" -Filter "libGLESv2.dll" -Recurse | Select-Object -First 1 | Copy-Item -Destination $Dist/

          # Copy icons / resources
          if (Test-Path "resources") {
            Copy-Item -Path "resources" -Destination "$Dist/resources" -Recurse
          }

          Write-Host "Distribution contents:"
          Get-ChildItem -Path $Dist

      - name: Self-Sign and Create Installable Package
        shell: pwsh
        run: |
          .\ports\windows\packaging\sign_and_package.ps1 -DistDir "dist/servo-windows-browser"

      # Integrity metadata only. This does not sign or update the artifact: production
      # signing, MSIX/Store packaging and the update channel remain deployment decisions.
      - name: Emit artifact SHA256 and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Artifact = "dist/servo-windows-browser-setup.zip"
          if (-not (Test-Path $Artifact)) {
            throw "Missing installable artifact: $Artifact"
          }

          $Hash = (Get-FileHash -Algorithm SHA256 -Path $Artifact).Hash.ToLowerInvariant()

          # Read the workspace version from Cargo.toml so the manifest cannot drift.
          $Version = "unknown"
          $InWorkspacePackage = $false
          foreach ($line in Get-Content "Cargo.toml") {
            if ($line -match '^\s*\[workspace\.package\]\s*$') { $InWorkspacePackage = $true; continue }
            if ($InWorkspacePackage -and $line -match '^\s*version\s*=\s*"([^"]+)"') {
              $Version = $Matches[1]
              break
            }
            if ($InWorkspacePackage -and $line -match '^\s*\[') { break }
          }

          $Manifest = [ordered]@{
            schema     = "servo-windows-browser-artifact/v1"
            artifact   = [System.IO.Path]::GetFileName($Artifact)
            version    = $Version
            commit     = "${{ github.sha }}"
            sha256     = $Hash
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $ManifestPath = "dist/servo-windows-browser-manifest.json"
          $Manifest | ConvertTo-Json -Depth 3 | Set-Content -Path $ManifestPath -Encoding utf8

          Write-Host "SHA256 ($Artifact) = $Hash"
          Write-Host "Wrote $ManifestPath"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @"
          ### Artifact integrity

          - Artifact: $($Manifest.artifact)
          - Version: $Version
          - Commit: $($Manifest.commit)
          - SHA256: $Hash

          "@

      - name: Upload Self-Signed Installable Browser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: servo-windows-browser-setup
          path: |
            dist/servo-windows-browser-setup.zip
            dist/servo-windows-browser-manifest.json
          if-no-files-found: error

